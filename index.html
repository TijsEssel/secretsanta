<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Santa kanscalculator v4</title><style>:root{--ink:#20302a;--muted:#68736d;--red:#b43a3a;--green:#24765c;--gold:#d49b32;--line:#ddd6c9;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:linear-gradient(135deg,#fff,#edf3ed);color:var(--ink)}main{max-width:1120px;margin:auto;padding:28px 18px 50px}header{display:flex;gap:16px;align-items:center;margin-bottom:20px}.badge{font-size:34px;background:var(--red);padding:13px;border-radius:18px}h1,h2{margin:.2em 0}.sub,.note{color:var(--muted)}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 30px #243c3018}label{font-weight:750}input,button{width:100%;font:inherit;padding:12px;border-radius:11px;margin-top:8px}input{border:2px solid var(--line);font-size:1.1rem}button{border:0;background:var(--green);color:#fff;font-weight:750}.metric{padding:14px 0;border-bottom:1px solid var(--line)}.metric strong{display:block;color:var(--red);font-size:1.28rem}.error{color:var(--red);min-height:1.4em}.chart{height:380px}canvas{width:100%;height:100%}.table{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.bar{height:8px;min-width:90px;background:#ebe5db;border-radius:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}@media(max-width:760px){.grid{grid-template-columns:1fr}.chart{height:320px}}</style></head><body><main><header><div class="badge">🎁</div><div><h1>Secret Santa-kanscalculator</h1><div class="sub">Gecorrigeerde kansberekening · automatische grafiekschaal · n tot 10.000.000.000</div></div></header><div class="grid"><section class="card"><label for="n">Aantal deelnemers n</label><input id="n" type="number" min="2" max="10000000000" step="1" value="10"><button id="go" type="button">Bereken</button><div id="err" class="error"></div><div id="metrics"></div></section><section class="card"><h2>Kans per aantal lussen</h2><div class="chart"><canvas id="cv"></canvas></div><p class="note">Verticale as: kans in %, op log<sub>10</sub>-schaal.</p></section></div><section class="card table"><h2>Verdeling</h2><table><thead><tr><th>Aantal lussen</th><th>Kans bij geldige trekking</th><th>Relatief</th></tr></thead><tbody id="rows"></tbody></table><p id="method" class="note"></p></section></main><script>(()=>{
const LIM=2000,$=id=>document.getElementById(id),N=$('n'),ER=$('err'),M=$('metrics'),R=$('rows'),CV=$('cv'),METHOD=$('method');
const sci=(x,d=6)=>{if(!Number.isFinite(x)||x===0)return'0,000000 × 10<sup>0</sup>';const e=Math.floor(Math.log10(Math.abs(x))),m=x/10**e;return`${m.toFixed(d).replace('.',',')} × 10<sup>${e}</sup>`};
const normalInt=x=>Math.round(x).toLocaleString('nl-BE');
const pctAxis=x=>{if(x<=0)return'0';const e=Math.floor(Math.log10(x));return`10^${e} %`};
function harmonicApprox(n,p=1){if(n<=200000){let s=0;for(let i=1;i<=n;i++)s+=1/i**p;return s}const inv=1/n;if(p===1)return Math.log(n)+0.5772156649015329+inv/2-inv*inv/12;return Math.PI*Math.PI/6-inv-inv*inv/2-inv**3/6}
function exact(n){let q0=1,q1=0,a0=[1],a1=[0,0];for(let m=2;m<=n;m++){const q=(1-1/m)*q1+q0/m,A=(m-1)*q1/(m*q),B=q0/(m*q),cur=Array(Math.floor(m/2)+1).fill(0);for(let k=1;k<cur.length;k++)cur[k]=A*(a1[k]||0)+B*(a0[k-1]||0);[a0,a1,q0,q1]=[a1,cur,q1,q]}return{q:q1,data:a1.map((p,k)=>({k,p})).filter(x=>x.k&&x.p>0),approx:false}}
function approx(n){const mean=harmonicApprox(n)-1,v=Math.max(.1,harmonicApprox(n)-harmonicApprox(n,2)),sd=Math.sqrt(v),lo=Math.max(1,Math.floor(mean-10*sd)),hi=Math.min(Math.floor(n/2),Math.ceil(mean+10*sd)),a=[];let sum=0;for(let k=lo;k<=hi;k++){const z=(k+.5-mean)/sd,p=Math.exp(-z*z/2);a.push({k,p});sum+=p}a.forEach(x=>x.p/=sum);return{q:1/Math.E,data:a,approx:true,mean,sd}}
function autoVisible(all){const peak=Math.max(...all.map(x=>x.p*100));const natural=Math.max(1e-12,peak*1e-5);let visible=all.filter(x=>x.p*100>=natural);if(visible.length<5)visible=all.slice().sort((a,b)=>b.p-a.p).slice(0,Math.min(5,all.length)).sort((a,b)=>a.k-b.k);if(visible.length>60){const peakItem=all.reduce((a,b)=>a.p>b.p?a:b),ranked=all.slice().sort((a,b)=>b.p-a.p).slice(0,60).sort((a,b)=>a.k-b.k);visible=ranked.includes(peakItem)?ranked:ranked}return{visible,floor:Math.min(...visible.map(x=>x.p*100))}}
function niceTicks(min,max,count=8){if(max<=min)return[min];const raw=(max-min)/count,pow=10**Math.floor(Math.log10(raw)),f=raw/pow,step=(f<=1?1:f<=2?2:f<=5?5:10)*pow,start=Math.ceil(min/step)*step,a=[];for(let x=start;x<=max+step*1e-9;x+=step)a.push(Math.round(x));if(!a.includes(Math.round(min)))a.unshift(Math.round(min));if(!a.includes(Math.round(max)))a.push(Math.round(max));return [...new Set(a)].sort((a,b)=>a-b)}
function draw(all){const av=autoVisible(all),data=av.visible,d=devicePixelRatio||1,b=CV.getBoundingClientRect(),W=b.width,H=b.height;CV.width=Math.round(W*d);CV.height=Math.round(H*d);const c=CV.getContext('2d');c.scale(d,d);c.clearRect(0,0,W,H);const pad={l:96,r:20,t:28,b:74},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,vals=data.map(x=>x.p*100),maxL=Math.ceil(Math.log10(Math.max(...vals))),minL=Math.floor(Math.log10(Math.min(...vals))),range=Math.max(1,maxL-minL),xMin=data[0].k,xMax=data.at(-1).k,xRange=Math.max(1,xMax-xMin);const xp=k=>pad.l+(k-xMin)/xRange*cw,yp=v=>pad.t+(maxL-Math.log10(v))/range*ch;c.font='12px system-ui';c.fillStyle='#20302a';for(let e=minL;e<=maxL;e++){const y=yp(10**e);c.strokeStyle='#d8d2c5';c.beginPath();c.moveTo(pad.l,y);c.lineTo(W-pad.r,y);c.stroke();c.textAlign='right';c.fillText(pctAxis(10**e),pad.l-8,y+4)}niceTicks(xMin,xMax,8).forEach(k=>{const x=xp(k);c.strokeStyle='#e8e2d7';c.beginPath();c.moveTo(x,pad.t);c.lineTo(x,pad.t+ch);c.stroke();c.fillStyle='#20302a';c.textAlign='center';c.fillText(normalInt(k),x,pad.t+ch+20)});const bw=Math.max(3,Math.min(28,cw/Math.max(1,data.length)*.72));data.forEach(x=>{const xx=xp(x.k)-bw/2,yy=yp(x.p*100),base=yp(10**minL);c.fillStyle='#24765c';c.fillRect(xx,yy,bw,Math.max(1,base-yy))});c.save();c.translate(20,pad.t+ch/2);c.rotate(-Math.PI/2);c.textAlign='center';c.font='bold 13px system-ui';c.fillStyle='#20302a';c.fillText('Kans bij geldige trekking (%) - log10-schaal',0,0);c.restore();c.font='bold 13px system-ui';c.textAlign='center';c.fillText('Aantal lussen k',pad.l+cw/2,H-12);return av}
function update(){const n=Number(N.value);if(!Number.isSafeInteger(n)||n<2||n>10000000000){ER.textContent='Kies een geheel aantal van 2 tot en met 10.000.000.000.';return}ER.textContent='';const r=n<=LIM?exact(n):approx(n),best=r.data.reduce((a,b)=>a.p>b.p?a:b),one=r.approx?Math.E/n:(r.data.find(x=>x.k===1)?.p||0),av=draw(r.data);M.innerHTML=`<div class="metric"><span>Deelnemers</span><strong>${normalInt(n)}</strong></div><div class="metric"><span>Kans op geldige trekking</span><strong>${sci(r.q*100)} %</strong></div><div class="metric"><span>Meest waarschijnlijk aantal lussen</span><strong>${normalInt(best.k)}</strong></div><div class="metric"><span>Kans op exact één lus</span><strong>${sci(one*100)} %</strong></div>`;R.innerHTML=av.visible.map(x=>`<tr><td>${normalInt(x.k)}</td><td>${sci(x.p*100)} %</td><td><div class="bar"><div class="fill" style="width:${Math.max(.2,100*x.p/best.p)}%"></div></div></td></tr>`).join('');METHOD.innerHTML=r.approx?`Voor n boven ${normalInt(LIM)} wordt een snelle normale benadering gebruikt. Gemiddeld aantal lussen: ${r.mean.toFixed(2).replace('.',',')}. De grafiek kiest automatisch het zinvolle zichtbare kansgebied.`:'De lusverdeling is rechtstreeks berekend. De grafiek kiest automatisch het zinvolle zichtbare kansgebied.'}
$('go').addEventListener('click',update);N.addEventListener('change',update);addEventListener('resize',update);update();
})();</script></body></html>
